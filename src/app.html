<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Favicon -->
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Critical preconnects: resolve these origins before any JS runs -->
		<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
		<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
		<link rel="preconnect" href="https://static.cloudflareinsights.com" crossorigin />

		<!-- DNS prefetch for analytics origins (non-blocking) -->
		<link rel="dns-prefetch" href="https://www.googletagmanager.com" />
		<link rel="dns-prefetch" href="https://www.google-analytics.com" />

		%sveltekit.head%

		<!-- Cloudflare Web Analytics — fully deferred, never blocks render -->
		<script
			defer
			src="https://static.cloudflareinsights.com/beacon.min.js"
			data-cf-beacon='{"token": "84745c0a3c924105a8df1514acdb13d4"}'
		></script>

		<!-- Google tag (gtag.js) — load after page is interactive -->
		<script>
			// Defer GA until after the page is interactive
			window.addEventListener('load', function () {
				var s = document.createElement('script');
				s.src = 'https://www.googletagmanager.com/gtag/js?id=G-V4B6N4QLJC';
				s.async = true;
				document.head.appendChild(s);
				window.dataLayer = window.dataLayer || [];
				function gtag() { dataLayer.push(arguments); }
				gtag('js', new Date());
				gtag('config', 'G-V4B6N4QLJC', { send_page_view: true });
			});
		</script>
	</head>

	<!-- data-sveltekit-preload-data="hover" pre-fetches linked pages on hover -->
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<div>%sveltekit.body%</div>
	</body>
</html>
